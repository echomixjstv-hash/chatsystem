<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>WebChat System</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f2f5;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   CHAT APP
========================= */

.chat-app{
    width:100%;
    max-width:520px;
    height:100vh;
    max-height:900px;
    background:#fff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,.12);
}

/* =========================
   HEADER
========================= */

.chat-header{
    height:65px;
    flex-shrink:0;
    background:#ffffff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:12px;
}

.profile{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,#1877f2,#6c5ce7);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-weight:bold;
    font-size:17px;
}

.profile-info{
    flex:1;
}

.profile-name{
    font-size:16px;
    font-weight:bold;
    color:#111;
}

.profile-status{
    font-size:12px;
    color:#31a24c;
    margin-top:2px;
}

.reset-btn{
    border:0;
    background:#f1f1f1;
    width:36px;
    height:36px;
    border-radius:50%;
    cursor:pointer;
    font-size:17px;
}

.reset-btn:hover{
    background:#e5e5e5;
}

/* =========================
   CHAT BODY
========================= */

.chat-body{
    flex:1;
    overflow-y:auto;
    padding:18px 13px 20px;
    background:#f7f8fa;
    scroll-behavior:smooth;
}

.chat-body::-webkit-scrollbar{
    width:6px;
}

.chat-body::-webkit-scrollbar-thumb{
    background:#ccc;
    border-radius:20px;
}

/* =========================
   MESSAGES
========================= */

.message-row{
    display:flex;
    margin:7px 0;
    width:100%;
}

.message-row.bot{
    justify-content:flex-start;
}

.message-row.user{
    justify-content:flex-end;
}

.message{
    max-width:82%;
    padding:10px 13px;
    border-radius:18px;
    font-size:15px;
    line-height:1.45;
    word-wrap:break-word;
}

.message.bot{
    background:#e4e6eb;
    color:#111;
    border-bottom-left-radius:5px;
}

.message.user{
    background:#1877f2;
    color:white;
    border-bottom-right-radius:5px;
}

.message a{
    color:#1877f2;
    text-decoration:underline;
    word-break:break-all;
}

.message.user a{
    color:#fff;
}

.message-time{
    font-size:10px;
    color:#888;
    margin-top:3px;
    padding:0 6px;
}

.message-row.user .message-time{
    text-align:right;
}

/* =========================
   TYPING
========================= */

.typing-row{
    display:flex;
    margin:8px 0;
}

.typing{
    background:#e4e6eb;
    padding:11px 15px;
    border-radius:18px;
    display:flex;
    gap:4px;
}

.dot{
    width:6px;
    height:6px;
    background:#777;
    border-radius:50%;
    animation:bounce 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{
        transform:translateY(0);
    }
    30%{
        transform:translateY(-5px);
    }
}

/* =========================
   READY SEND AREA
========================= */

.ready-area{
    flex-shrink:0;
    background:#fff;
    border-top:1px solid #ddd;
    padding:9px 10px;
}

.ready-label{
    font-size:11px;
    color:#888;
    margin:0 0 7px 4px;
}

.ready-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.ready-btn{
    border:1px solid #1877f2;
    background:#fff;
    color:#1877f2;
    border-radius:20px;
    padding:9px 14px;
    font-size:14px;
    cursor:pointer;
    transition:.15s;
}

.ready-btn:hover{
    background:#1877f2;
    color:#fff;
}

.ready-btn:active{
    transform:scale(.96);
}

/* =========================
   INPUT
========================= */

.input-area{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:9px 10px;
    background:#fff;
    border-top:1px solid #eee;
}

.chat-input{
    flex:1;
    min-width:0;
    height:42px;
    border:1px solid #ddd;
    border-radius:22px;
    padding:0 15px;
    outline:none;
    font-size:14px;
}

.chat-input:focus{
    border-color:#1877f2;
}

.send-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#1877f2;
    color:white;
    cursor:pointer;
    font-size:17px;
}

.send-btn:active{
    transform:scale(.94);
}

/* =========================
   ALARM BUTTON
========================= */

.alarm-box{
    margin-top:8px;
    padding:10px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
}

.alarm-btn{
    border:0;
    background:#1877f2;
    color:white;
    padding:10px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

.alarm-btn:hover{
    background:#0d65d8;
}

/* =========================
   LINK MESSAGE
========================= */

.orientation-link{
    display:block;
    margin-top:8px;
    padding:10px;
    background:#fff;
    border-radius:10px;
    text-decoration:none !important;
    color:#1877f2 !important;
    font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        background:#fff;
    }

    .chat-app{
        width:100%;
        height:100dvh;
        max-height:none;
        box-shadow:none;
    }

    .chat-header{
        height:60px;
    }

    .chat-body{
        padding:14px 10px 16px;
    }

    .message{
        max-width:88%;
        font-size:14px;
    }

    .ready-btn{
        font-size:13px;
        padding:8px 12px;
    }

    .input-area{
        padding-bottom:
            calc(9px + env(safe-area-inset-bottom));
    }

}

</style>
</head>

<body>

<div class="chat-app">

    <!-- HEADER -->

    <div class="chat-header">

        <div class="profile">
            PL
        </div>

        <div class="profile-info">

            <div class="profile-name">
                Prime Legacy
            </div>

            <div class="profile-status">
                ● Online
            </div>

        </div>

        <button
            class="reset-btn"
            onclick="resetConversation()"
            title="Reset conversation">
            ↻
        </button>

    </div>


    <!-- CHAT -->

    <div
        id="chatBody"
        class="chat-body">
    </div>


    <!-- READY SEND -->

    <div
        id="readyArea"
        class="ready-area">

        <div class="ready-label">
            Ready to send
        </div>

        <div
            id="readyButtons"
            class="ready-buttons">
        </div>

    </div>


    <!-- NORMAL INPUT -->

    <div class="input-area">

        <input
            id="chatInput"
            class="chat-input"
            type="text"
            placeholder="Type a message...">

        <button
            class="send-btn"
            onclick="sendTypedMessage()">
            ➤
        </button>

    </div>

</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const STORAGE_KEY = "primeLegacyWebChat_v1";

const ORIENTATION_URL =
"https://primelegacyframework.com/webinar/f8cd4b47-ec99-41f4-b470-e95b2ebe9ba0?ref=84A4C240";


/* =========================================================
   STATE
========================================================= */

let state = {

    messages: [],

    step: "interest",

    selectedEmployment: null,

    selectedTime: null,

    scheduleTimestamp: null,

    orientationSent: false

};


/* =========================================================
   LOAD
========================================================= */

function loadState(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            state = JSON.parse(saved);

        }

    }catch(error){

        console.error(
            "Unable to load chat:",
            error
        );

    }

}


/* =========================================================
   SAVE
========================================================= */

function saveState(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FORMAT MESSAGE
========================================================= */

function formatMessage(text){

    let html =
        escapeHTML(text);

    /*
       Convert URL to clickable link
    */

    html = html.replace(
        /(https?:\/\/[^\s<]+)/g,
        function(url){

            return `
                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer">
                    ${url}
                </a>
            `;

        }
    );

    /*
       New lines
    */

    html =
        html.replace(/\n/g,"<br>");

    return html;

}


/* =========================================================
   TIME
========================================================= */

function getTime(){

    return new Date().toLocaleTimeString(
        [],
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    sender,
    text,
    save=true
){

    state.messages.push({

        sender:sender,

        text:text,

        time:getTime()

    });

    if(save){

        saveState();

    }

    renderMessages();

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const chat =
        document.getElementById("chatBody");

    chat.innerHTML = "";

    state.messages.forEach(
        message => {

            const row =
                document.createElement("div");

            row.className =
                "message-row " +
                message.sender;

            const wrapper =
                document.createElement("div");

            const bubble =
                document.createElement("div");

            bubble.className =
                "message " +
                message.sender;

            bubble.innerHTML =
                formatMessage(
                    message.text
                );

            const time =
                document.createElement("div");

            time.className =
                "message-time";

            time.textContent =
                message.time;

            wrapper.appendChild(
                bubble
            );

            wrapper.appendChild(
                time
            );

            row.appendChild(
                wrapper
            );

            chat.appendChild(
                row
            );

        }
    );

    scrollBottom();

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    const chat =
        document.getElementById("chatBody");

    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    },50);

}


/* =========================================================
   TYPING INDICATOR
========================================================= */

function showTyping(){

    const chat =
        document.getElementById("chatBody");

    const row =
        document.createElement("div");

    row.className =
        "typing-row";

    row.id =
        "typingIndicator";

    row.innerHTML = `

        <div class="typing">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

    `;

    chat.appendChild(row);

    scrollBottom();

}


function hideTyping(){

    const typing =
        document.getElementById(
            "typingIndicator"
        );

    if(typing){

        typing.remove();

    }

}


/* =========================================================
   BOT REPLY
========================================================= */

function botReply(
    text,
    delay=900,
    callback=null
){

    showTyping();

    setTimeout(() => {

        hideTyping();

        addMessage(
            "bot",
            text
        );

        if(callback){

            callback();

        }

    },delay);

}


/* =========================================================
   READY BUTTONS
========================================================= */

function setReadyButtons(
    buttons
){

    const container =
        document.getElementById(
            "readyButtons"
        );

    container.innerHTML = "";

    buttons.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "ready-btn";

            button.textContent =
                item.label;

            button.onclick =
                item.action;

            container.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   INITIAL READY BUTTON
========================================================= */

function showInterestButton(){

    setReadyButtons([

        {
            label:
                "Hello I'm interested",

            action:
                () => {

                    sendUserMessage(
                        "Hello I'm interested"
                    );

                    processInterest();

                }

        }

    ]);

}


/* =========================================================
   INTEREST FLOW
========================================================= */

function processInterest(){

    state.step =
        "employment";

    saveState();

    botReply(
        "Hello, great day! Quick question are you a student, employed, or unemployed?",
        900,
        showEmploymentButtons
    );

}


/* =========================================================
   EMPLOYMENT BUTTONS
========================================================= */

function showEmploymentButtons(){

    setReadyButtons([

        {
            label:"Student",

            action:() => {

                sendUserMessage(
                    "Student"
                );

                processEmployment(
                    "Student"
                );

            }

        },

        {
            label:"Employed",

            action:() => {

                sendUserMessage(
                    "Employed"
                );

                processEmployment(
                    "Employed"
                );

            }

        },

        {
            label:"Unemployed",

            action:() => {

                sendUserMessage(
                    "Unemployed"
                );

                processEmployment(
                    "Unemployed"
                );

            }

        }

    ]);

}


/* =========================================================
   EMPLOYMENT RESPONSE
========================================================= */

function processEmployment(
    employment
){

    state.selectedEmployment =
        employment;

    state.step =
        "scheduleInfo";

    saveState();

    botReply(
        "Copy, send ako schedule for discussion 😊",
        800,
        () => {

            botReply(
                `We’re hosting a FREE briefing and screening via website, where we’ll cover everything you need to know about becoming a online appointment setter.

Available time slots: AUGUST 22, 2026 (TODAY) 12NN, 3PM, 5PM and 7PM

PLEASE REPLY YOUR TIME AVAILABILITY TO SECURE YOUR SLOTS.

THE BRIEFING WILL RUN FOR 45 MINUTES TO 1 HOUR.

GOD BLESS AND KEEP SAFE! 😊`,
                1200,
                showScheduleButtons
            );

        }
    );

}


/* =========================================================
   SCHEDULE BUTTONS
========================================================= */

function showScheduleButtons(){

    state.step =
        "timeSelection";

    saveState();

    setReadyButtons([

        {
            label:"12NN",

            action:() => {

                selectSchedule(
                    "12NN",
                    12
                );

            }

        },

        {
            label:"3PM",

            action:() => {

                selectSchedule(
                    "3PM",
                    15
                );

            }

        },

        {
            label:"5PM",

            action:() => {

                selectSchedule(
                    "5PM",
                    17
                );

            }

        },

        {
            label:"7PM",

            action:() => {

                selectSchedule(
                    "7PM",
                    19
                );

            }

        }

    ]);

}


/* =========================================================
   SELECT SCHEDULE
========================================================= */

function selectSchedule(
    displayTime,
    hour
){

    sendUserMessage(
        displayTime
    );

    state.selectedTime =
        displayTime;

    /*
       August 22, 2026
    */

    const schedule =
        new Date(
            2026,
            7,
            22,
            hour,
            0,
            0
        );

    state.scheduleTimestamp =
        schedule.getTime();

    state.step =
        "scheduled";

    saveState();

    botReply(
        "The schedule is already set! 😊 make an alarm for the chosen availability hour then come back here later.",
        1000,
        showAlarmButton
    );

}


/* =========================================================
   ALARM BUTTON
========================================================= */

function showAlarmButton(){

    setReadyButtons([

        {
            label:"⏰ Alarm Settings",

            action:openAlarmSettings

        }

    ]);

}


/* =========================================================
   OPEN PHONE ALARM
========================================================= */

function openAlarmSettings(){

    /*
       Try Android clock/alarm intent first.
    */

    const hour =
        getSelectedHour();

    /*
       Android intent
    */

    const androidIntent =
        `intent://clock/alarm#Intent;scheme=android-app;package=com.google.android.deskclock;end`;

    /*
       Attempt to open alarm application.
    */

    window.location.href =
        androidIntent;

    /*
       Fallback message.
    */

    setTimeout(() => {

        alert(
            "If your phone did not open the Alarm app automatically, please open your Clock/Alarm app and set an alarm for " +
            state.selectedTime + "."
        );

    },1200);

}


/* =========================================================
   SELECTED HOUR
========================================================= */

function getSelectedHour(){

    if(state.selectedTime === "12NN"){
        return 12;
    }

    if(state.selectedTime === "3PM"){
        return 15;
    }

    if(state.selectedTime === "5PM"){
        return 17;
    }

    if(state.selectedTime === "7PM"){
        return 19;
    }

    return 12;

}


/* =========================================================
   ORIENTATION MESSAGE
========================================================= */

function sendOrientationMessage(){

    if(state.orientationSent){

        return;

    }

    state.orientationSent =
        true;

    state.step =
        "orientation";

    saveState();

    const message =
`Hi po! Here’s the link to join for your orientation schedule. You can click it on or before schedule time.

🔗 ${ORIENTATION_URL}

📌 Endorser: TL RALPH

Looking forward to see you there! Thanks and God bless 🤍

Please kindly read the rules and instructions in the live briefing to avoid automatic disqualification.

Once you are in the live session, please reply, “I’m in.”

Looking forward to see you there! Thanks and God bless`;

    botReply(
        message,
        1000,
        () => {

            setReadyButtons([

                {
                    label:"I'm in",

                    action:() => {

                        sendUserMessage(
                            "I'm in"
                        );

                    }

                }

            ]);

        }
    );

}


/* =========================================================
   CHECK SCHEDULE
========================================================= */

function checkSchedule(){

    if(
        !state.scheduleTimestamp ||
        state.orientationSent
    ){

        return;

    }

    const now =
        Date.now();

    /*
       Once scheduled time has arrived,
       send orientation message when user
       opens/returns to website.
    */

    if(
        now >= state.scheduleTimestamp
    ){

        sendOrientationMessage();

    }

}


/* =========================================================
   USER MESSAGE
========================================================= */

function sendUserMessage(
    text
){

    addMessage(
        "user",
        text
    );

}


/* =========================================================
   TYPED MESSAGE
========================================================= */

function sendTypedMessage(){

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if(!text){

        return;

    }

    sendUserMessage(text);

    input.value = "";

    /*
       Basic automatic handling
    */

    handleTypedMessage(text);

}


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("chatInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                sendTypedMessage();

            }

        }
    );


/* =========================================================
   TYPED MESSAGE HANDLER
========================================================= */

function handleTypedMessage(
    text
){

    const lower =
        text.toLowerCase().trim();

    /*
       Interest
    */

    if(
        state.step === "interest" &&
        lower.includes("interested")
    ){

        processInterest();

        return;

    }


    /*
       Employment
    */

    if(
        state.step === "employment"
    ){

        if(
            lower === "student" ||
            lower === "employed" ||
            lower === "unemployed"
        ){

            processEmployment(
                text
            );

            return;

        }

    }


    /*
       Time selection
    */

    if(
        state.step === "timeSelection"
    ){

        if(lower === "12nn"){

            selectSchedule(
                "12NN",
                12
            );

            return;

        }

        if(lower === "3pm"){

            selectSchedule(
                "3PM",
                15
            );

            return;

        }

        if(lower === "5pm"){

            selectSchedule(
                "5PM",
                17
            );

            return;

        }

        if(lower === "7pm"){

            selectSchedule(
                "7PM",
                19
            );

            return;

        }

    }

}


/* =========================================================
   RESTORE READY BUTTONS
========================================================= */

function restoreReadyButtons(){

    if(
        state.step === "interest"
    ){

        showInterestButton();

        return;

    }


    if(
        state.step === "employment"
    ){

        showEmploymentButtons();

        return;

    }


    if(
        state.step === "timeSelection"
    ){

        showScheduleButtons();

        return;

    }


    if(
        state.step === "scheduled"
    ){

        /*
           If schedule time already passed,
           send orientation.
        */

        if(
            Date.now() >=
            state.scheduleTimestamp
        ){

            sendOrientationMessage();

        }else{

            showAlarmButton();

        }

        return;

    }


    if(
        state.step === "orientation"
    ){

        setReadyButtons([

            {
                label:"I'm in",

                action:() => {

                    sendUserMessage(
                        "I'm in"
                    );

                }

            }

        ]);

        return;

    }

    setReadyButtons([]);

}


/* =========================================================
   INITIAL GREETING
========================================================= */

function initializeChat(){

    loadState();

    /*
       First visit
    */

    if(
        state.messages.length === 0
    ){

        addMessage(
            "bot",
            "Hello! How can I help you today?",
            false
        );

        state.step =
            "interest";

        saveState();

    }

    renderMessages();

    restoreReadyButtons();

    /*
       Check schedule immediately
    */

    checkSchedule();

}


/* =========================================================
   RETURN TO WEBSITE
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            loadState();

            checkSchedule();

            renderMessages();

            restoreReadyButtons();

        }

    }
);


/* =========================================================
   WHEN WINDOW GETS FOCUS
========================================================= */

window.addEventListener(
    "focus",
    function(){

        loadState();

        checkSchedule();

        renderMessages();

        restoreReadyButtons();

    }
);


/* =========================================================
   PERIODIC CHECK
========================================================= */

setInterval(
    function(){

        loadState();

        checkSchedule();

    },
    10000
);


/* =========================================================
   RESET
========================================================= */

function resetConversation(){

    const confirmed =
        confirm(
            "Reset the entire conversation?"
        );

    if(!confirmed){

        return;

    }

    localStorage.removeItem(
        STORAGE_KEY
    );

    location.reload();

}


/* =========================================================
   START
========================================================= */

initializeChat();

</script>

</body>
</html>
